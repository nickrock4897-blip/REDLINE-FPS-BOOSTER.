
name: Build REDLINE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          mkdir -p project
          if [ ! -f REDLINE-FPS-BOOSTER.zip ]; then
            echo "ERROR: REDLINE-FPS-BOOSTER.zip is missing from the repository root."
            exit 1
          fi

          unzip -o REDLINE-FPS-BOOSTER.zip -d project

          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle Android project found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-FPS-BOOSTER-APK
          path: project/REDLINE-FPS-BOOSTER/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

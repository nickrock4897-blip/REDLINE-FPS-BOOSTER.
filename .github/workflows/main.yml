name: Build REDLINE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files
        run: find . -maxdepth 4 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and build Android project
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Kein Android-Projekt gefunden. Die Projektdateien fehlen im Repository."
            exit 1
          fi
          cd "$(dirname "$SETTINGS_FILE")"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-FPS-BOOSTER-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error

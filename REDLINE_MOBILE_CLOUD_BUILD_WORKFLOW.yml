name: Build REDLINE FPS Booster from ZIP

on:
  push:
    paths:
      - 'REDLINE-FPS-BOOSTER.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project archive
        run: unzip -q REDLINE-FPS-BOOSTER.zip -d unpacked

      - name: Build debug APK
        run: gradle --no-daemon -p unpacked/REDLINE-FPS-BOOSTER :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-FPS-BOOSTER-debug-APK
          path: unpacked/REDLINE-FPS-BOOSTER/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
